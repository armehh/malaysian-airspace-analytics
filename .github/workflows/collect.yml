# Penjadual PERCUMA alternatif kepada cron-job.org.
# Nota: GitHub Actions cron boleh lewat beberapa minit dan minimum 5 minit; cron-job.org lebih tepat.
name: Collect snapshot
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body -sS -m 60 -X POST \
            -H "x-collector-secret: ${{ secrets.COLLECTOR_SECRET }}" \
            "${{ secrets.API_URL }}/api/collect"
